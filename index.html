<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Price Comparison - Find the Best Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Shopping List Price Comparison</h1>
            <p class="subtitle">Find the best store to buy your entire shopping list</p>
        </header>

        <main>
            <div class="main-layout">
                <aside class="category-sidebar">
                    <h2>Categories</h2>
                    <div id="category-list" class="category-list">
                        <!-- Categories will be populated here -->
                    </div>
                </aside>

                <div class="main-content">
                    <section class="shopping-list-section">
                        <h2>Your Shopping List</h2>
                        <div class="product-selector">
                            <div class="selector-group">
                                <label for="product-select">Select Product:</label>
                                <select id="product-select" class="product-select">
                                    <option value="">-- Choose a product --</option>
                                </select>
                            </div>
                            <div class="selector-group">
                                <label for="brand-select">Brand:</label>
                                <select id="brand-select" class="brand-select">
                                    <option value="house">House Brand (Huismerk)</option>
                                    <option value="premium">Premium Brand</option>
                                </select>
                            </div>
                            <button id="add-item-btn" class="btn btn-primary">Add to List</button>
                        </div>
                        
                        <ul id="shopping-list" class="shopping-list">
                            <!-- Items will be added here dynamically -->
                        </ul>

                        <button id="compare-btn" class="btn btn-success" disabled>Compare Prices</button>
                    </section>

                    <section class="results-section" id="results-section" style="display: none;">
                        <h2>Comparison Results</h2>
                        <div id="results-container">
                            <!-- Results will be displayed here -->
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer>
            <p>Comparing prices across major Belgian and Dutch supermarkets</p>
        </footer>
    </div>

    <script src="stores-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
